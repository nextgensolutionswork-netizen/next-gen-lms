services:
  - type: web
    name: next-gen-sap-lms
    env: node
    plan: starter
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    domains:
      - lms.next-generpsolutions.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://lms.next-generpsolutions.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_CURRENCY
        value: INR
      - key: NEXT_PUBLIC_DEFAULT_TIMEZONE
        value: Asia/Kolkata
